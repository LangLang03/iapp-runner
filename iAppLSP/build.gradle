plugins {
    id 'java'
    id 'application'
}

group = 'cn.langlang'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':')
    implementation project(':YuWeb')
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.21.0'
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:0.21.0'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.9'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
jar {
    manifest {
        attributes 'Main-Class': 'cn.langlang.iapp.lsp.server.LaunchServer'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}
application {
    mainClass = 'cn.langlang.iapp.lsp.server.LaunchServer'
}

test {
    useJUnitPlatform()
}

tasks.register('runTest', JavaExec) {
    group = 'application'
    description = 'Run LSP test'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cn.langlang.iapp.lsp.TestLSP'
}
